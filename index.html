<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>블록 클래식</title>
<style>
:root{color-scheme:dark;--bg:#070c19;--panel:#121d31;--edge:#2b3d57;--txt:#eaf4ff;--sub:#9fb5cd;--gold:#ffd471;--accent:#6fe0ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:var(--txt);touch-action:none}
body{background:radial-gradient(circle at 70% 20%,#152440 0,#090f20 56%,#070b14 100%)}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:none;border:0;font-weight:800}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.screen{width:100%;height:100%;height:100dvh;display:none;align-items:center;flex-direction:column}
.screen.active{display:flex}
#menu{justify-content:center;gap:0;padding:30px 24px 45px;text-align:center;background:radial-gradient(ellipse at top,#172642 0%,transparent 70%)}
.menu-shapes{display:flex;gap:8px;margin-bottom:30px;filter:drop-shadow(0 8px 25px #0cb3d34d)}
.mini-block{width:42px;height:42px;border-radius:8px;border:3px solid #ffffff55;box-shadow:inset 0 4px 0 #ffffff50,0 10px 16px #0008;transform:rotate(-9deg)}
.mini-block:nth-child(2){background:#fdcf63;transform:translateY(-8px) rotate(8deg)}
.mini-block:nth-child(3){background:#ba90ff;transform:rotate(-6deg)}
.mini-block:nth-child(1){background:#48d7e5}
#menu h1{font-weight:1000;font-size:clamp(38px,10vw,55px);letter-spacing:-2px;line-height:1.1;margin:0 0 9px;text-shadow:0 4px 20px #0009}
#menu .desc{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--accent);margin:0 0 46px}
.menu-actions{display:flex;flex-direction:column;gap:13px;width:min(100%,290px)}
.primary,.secondary{height:58px;border-radius:15px;box-shadow:0 8px 22px #0007;font-size:20px}
.primary{background:linear-gradient(165deg,#79e3e9,#43aacc);color:#082236;text-shadow:0 1px #fff6}
.secondary{background:#25334c;border:1px solid #465877;color:#e6eef9}
.primary:active,.secondary:active,.small:active,.ctrl:active{transform:scale(.97);filter:brightness(1.17)}
.menu-footer{font-size:12px;color:#8a9cb6;margin-top:34px;line-height:1.8}
#game{justify-content:flex-start;gap:0;padding:max(8px,env(safe-area-inset-top)) 12px max(5px,env(safe-area-inset-bottom));position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:500px;min-height:43px;gap:8px}
.brand{font-size:18px;font-weight:1000;letter-spacing:1.1px;white-space:nowrap}
.top-actions{display:flex;gap:8px}
.small{background:#22334b;border:1px solid #435574;min-height:38px;border-radius:11px;padding:0 15px;font-size:14px}
#pauseBtn{background:#234d5c;color:#d4f7ff}
.hud{width:min(100%,410px);display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 0 7px}
.hud-cell{background:#152238;border:1px solid #263d57;border-radius:9px;padding:5px 3px 4px;text-align:center;min-width:0}
.hud-cell .lab{font-size:10px;font-weight:800;letter-spacing:.6px;color:#9eb5cf}
.hud-cell .val{font-size:clamp(15px,4.3vw,21px);line-height:1.3;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;color:#f3f7ff}
.field-line{display:flex;justify-content:center;align-items:flex-start;gap:8px;width:100%;min-height:0}
.board-wrap{position:relative;flex:none;width:var(--board-w,280px);height:calc(var(--board-w,280px) * 2);border:2px solid #4d6689;border-radius:5px;box-shadow:0 0 0 3px #0f1729,0 6px 32px #0009;overflow:hidden;background:#111d30}
#board,#effects{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none}
#effects{pointer-events:none}
.side{display:flex;flex-direction:column;gap:6px;max-width:74px;min-width:57px;width:calc((100vw - var(--board-w,280px) - 42px)/2);text-align:center}
.side-tile{border-radius:8px;background:#152238;border:1px solid #293d57;padding:8px 3px;color:#b1c6df;font-size:10px;font-weight:900}
#next{width:100%;display:block;margin-top:5px;aspect-ratio:1}
#nextAfter{width:70%;display:block;margin:4px auto 0;aspect-ratio:1}
.side-tile.after{padding:6px 2px;font-size:9px;opacity:.88}
/* 즉시 버튼은 게임판이 아닌 오른쪽 정보 패널 내부에 배치합니다. */
.side{position:relative;height:calc(var(--board-w,280px) * 2)}
#dropBtn{position:absolute;right:0;bottom:12px;width:min(100%,62px);height:82px;min-height:0;z-index:5;padding:0 1px;font-size:19px;border-radius:10px}
#dropBtn small{display:block;margin-top:3px;font-size:9px;letter-spacing:-.5px}
.side-caption{line-height:1.35;font-size:10px;color:#96abc8;margin-top:8px}
.controls{position:relative;width:100%;max-width:410px;flex:1;min-height:65px;max-height:106px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:stretch;padding-top:7px;padding-bottom:4px}
.ctrl{background:linear-gradient(#293c5a,#1b2942);border:1px solid #526888;border-bottom:4px solid #10192c;border-radius:14px;font-size:23px;min-width:0;min-height:65px;box-shadow:0 6px 15px #0005}
.ctrl small{display:block;font-size:10px;margin-top:3px;font-weight:700;color:#b7d2e9}
.ctrl.turn{background:linear-gradient(#564477,#30274e);border-color:#7665a5}
.ctrl.drop{background:linear-gradient(#3a665d,#204841);border-color:#5c978a}
#toast{position:absolute;z-index:4;top:24%;left:50%;transform:translate(-50%,0) scale(.8);width:90%;pointer-events:none;text-align:center;font-size:27px;font-weight:1000;text-shadow:0 3px 5px #000,0 0 15px #000;color:#ffed9f;opacity:0;transition:opacity .15s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast small{display:block;color:#e7faff;font-size:16px;letter-spacing:1px}
.overlay{position:absolute;inset:0;background:#030a17d9;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.overlay.active{display:flex}
.modal{background:linear-gradient(145deg,#1b2b45,#111b2e);border:1px solid #526481;border-radius:22px;width:min(100%,350px);padding:32px 24px;display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center;box-shadow:0 24px 70px #000b}
.modal h2{font-size:32px;margin:0 0 6px}.modal p{font-size:14px;color:#b9cde4;margin:0 0 15px;line-height:1.6}
.modal .primary,.modal .secondary{height:54px;font-size:17px}
@media (max-height:690px){.topbar{min-height:35px}.hud{padding:3px 0}.hud-cell{padding:3px}.controls{padding-top:4px;min-height:54px}#dropBtn{height:65px;bottom:8px}.ctrl{min-height:47px;font-size:18px}.ctrl small{font-size:9px}}
</style>
</head>
<body>
<section id="menu" class="screen active" aria-label="메인 메뉴">
 <div class="menu-shapes"><div class="mini-block"></div><div class="mini-block"></div><div class="mini-block"></div></div>
 <h1>BLOCK<br>CLASSIC</h1><p class="desc">클래식 블록 퍼즐</p>
 <div class="menu-actions"><button id="startBtn" class="primary">▶ 게임 시작</button><button id="exitBtn" class="secondary">종료</button></div>
 <div class="menu-footer">최고 점수 <b id="menuBest">0</b>점<br>오프라인 플레이 · 터치 조작 지원</div>
</section>
<section id="game" class="screen" aria-label="게임 화면">
 <div class="topbar"><div class="brand">BLOCK CLASSIC</div><div class="top-actions"><button id="soundBtn" class="small" aria-label="소리 끄기">🔊</button><button id="pauseBtn" class="small">Ⅱ 일시정지</button></div></div>
 <div class="hud"><div class="hud-cell"><div class="lab">점수</div><div id="score" class="val">0</div></div><div class="hud-cell"><div class="lab">레벨</div><div id="level" class="val">1</div></div><div class="hud-cell"><div class="lab">제거 줄</div><div id="lines" class="val">0</div></div><div class="hud-cell"><div class="lab">최고점</div><div id="best" class="val">0</div></div></div>
 <div class="field-line"><div class="board-wrap"><canvas id="board" width="300" height="600" aria-label="테트리스 게임판"></canvas><canvas id="effects" width="300" height="600"></canvas><div id="toast" role="status"></div></div><aside class="side"><div class="side-tile">다음 블록<canvas id="next" width="104" height="104"></canvas></div><div class="side-tile after">다다음 블록<canvas id="nextAfter" width="104" height="104" aria-label="다다음 블록 미리보기"></canvas></div><div id="comboSide" class="side-tile" style="display:none;color:#ffe598">COMBO<br><span id="comboN" style="font-size:20px">×2</span></div><div class="side-caption">블록판을<br>터치하면 회전<br>드래그로 이동</div><button class="ctrl drop" id="dropBtn" aria-label="즉시 낙하">⤓<small>즉시</small></button></aside></div>
 <div class="controls"><button class="ctrl" id="leftBtn" aria-label="왼쪽 이동">◀<small>왼쪽</small></button><button class="ctrl turn" id="turnBtn" aria-label="회전">⟳<small>회전</small></button><button class="ctrl" id="downBtn" aria-label="빠른 낙하">▼<small>내리기</small></button><button class="ctrl" id="rightBtn" aria-label="오른쪽 이동">▶<small>오른쪽</small></button></div>
 <div class="overlay" id="pauseOverlay"><div class="modal"><h2>일시정지</h2><p>게임 진행이 멈췄습니다.</p><button id="resumeBtn" class="primary">▶ 계속하기</button><button id="menuBtn" class="secondary">⌂ 메인 메뉴로</button></div></div>
 <div class="overlay" id="overOverlay"><div class="modal"><h2>게임 종료!</h2><p id="finalScore">점수 0점</p><button id="retryBtn" class="primary">↻ 다시 시작</button><button id="overMenuBtn" class="secondary">⌂ 메인 메뉴로</button></div></div>
</section>
<audio id="customBgm" src="./audio/arcade-theme.mp3" preload="none" loop></audio>
<script>
'use strict';
(() => {
const COLS=10,ROWS=20,SIZE=30, SCORE=[0,100,200,300,500];
const COLORS={I:'#54dcec',O:'#ffd568',T:'#b589f4',S:'#62dfab',Z:'#ff7589',J:'#6f9cfa',L:'#ffaa68'};
const SHAPES={
 I:{n:4,c:[[0,1],[1,1],[2,1],[3,1]]},O:{n:2,c:[[0,0],[1,0],[0,1],[1,1]]},
 T:{n:3,c:[[1,0],[0,1],[1,1],[2,1]]},S:{n:3,c:[[1,0],[2,0],[0,1],[1,1]]},
 Z:{n:3,c:[[0,0],[1,0],[1,1],[2,1]]},J:{n:3,c:[[0,0],[0,1],[1,1],[2,1]]},
 L:{n:3,c:[[2,0],[0,1],[1,1],[2,1]]}
};
const $=id=>document.getElementById(id);
const board=$('board'),ctx=board.getContext('2d'),fx=$('effects'),fctx=fx.getContext('2d'),nc=$('next'),nctx=nc.getContext('2d'),nextAfterCanvas=$('nextAfter'),actx=nextAfterCanvas.getContext('2d');
let grid=Array.from({length:ROWS},()=>Array(COLS).fill(null)),piece=null,nextType='I',afterType='O',bag=[],score=0,best=0,lines=0,level=1,combo=-1,status='menu';
let last=0,fallAccum=0,particles=[],toastTimeout=null,fxMessageTimeout=0,hold=null,gameGeneration=0;
// 착지 후 0.5초 동안 입력이 없을 때 고정. 좌우/회전/내리기 입력은 유예시간 갱신.
const LOCK_DELAY=500;
let groundedSince=null, lockFlash=null;
function grounded(){return !!piece && !valid(piece.c,piece.x,piece.y+1);}
function refreshGroundedTimer(){groundedSince=grounded()?performance.now():null;}
function inputActivity(){if(status==='playing' && grounded())groundedSince=performance.now();}

try{best=Number(localStorage.getItem('blockclassic_best'))||0;}catch(e){}
let muted=false;try{muted=localStorage.getItem('blockclassic_mute')==='true';}catch(e){}
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,stepTimer=null,musicIndex=0;
const customBgm=$('customBgm');
let customTrackAvailable=null;
customBgm.addEventListener('error',()=>{customTrackAvailable=false;if(status==='playing'&&!muted&&!stepTimer)startSynthMusic();});
customBgm.addEventListener('canplay',()=>{customTrackAvailable=true;});
// 러시아 전통 민요 'Korobeiniki'를 직접 합성하는 편곡. 원본 게임 음원 미사용.
// 음높이 + 길이(8분음표 수)의 독자적 단음 편곡.
const TUNE=[['E5',2],['B4',1],['C5',1],['D5',2],['C5',1],['B4',1],['A4',2],['A4',1],['C5',1],['E5',2],['D5',1],['C5',1],
 ['B4',3],['C5',1],['D5',2],['E5',2],['C5',2],['A4',2],['A4',4],
 ['D5',2],['F5',1],['A5',2],['G5',1],['F5',1],['E5',3],['C5',1],['E5',2],['D5',1],['C5',1],
 ['B4',2],['B4',1],['C5',1],['D5',2],['E5',2],['C5',2],['A4',2],['A4',4]];
const NOTES={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function freq(note){let m=note.match(/^([A-G]#?)(\d)$/);if(!m)return 440;let midi=(Number(m[2])+1)*12+NOTES[m[1]];return 440*Math.pow(2,(midi-69)/12);}
function initAudio(){if(!AC||muted)return;try{if(!ac)ac=new AC();if(ac.state==='suspended')ac.resume().catch(()=>{});}catch(e){}}
function tone(hz,when,duration,vol=.09,type='triangle'){
 if(!ac||muted)return;
 try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(hz,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),when+.015);g.gain.exponentialRampToValueAtTime(.0001,when+Math.max(.05,duration));o.connect(g);g.connect(ac.destination);o.start(when);o.stop(when+duration+.04);}catch(e){}
}
function effect(n){if(!ac||muted)return;const at=ac.currentTime+.01;
 // 1·2·3·4줄 제거 시 차례로 화음·상승음이 풍성해지는 효과
 const pitches=[[523.25],[523.25,659.25],[523.25,659.25,783.99],[523.25,659.25,783.99,1046.5]][n-1]||[];
 pitches.forEach((f,i)=>tone(f,at+i*.085,.19+i*.05,.13,'sine'));
 if(n===4){tone(1318.51,at+.36,.37,.12,'triangle');tone(1567.98,at+.46,.40,.1,'sine');}
}
function boomSound(){if(!ac||muted)return;const t=ac.currentTime;[523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*.075,.25,.085,'triangle'));}
// 기본 음원: 전통 민요 Korobeiniki의 자체 합성 아케이드풍 편곡.
// 사용자가 audio/arcade-theme.mp3에 사용 권한이 있는 음원을 넣으면 해당 음원을 우선 재생합니다.
function musicVoice(hz,when,duration,volume=.062,bass=false){
 if(!ac||muted)return;
 try{
  const env=ac.createGain(),filter=ac.createBiquadFilter();
  filter.type='lowpass';filter.frequency.value=bass?1050:3400;
  env.gain.setValueAtTime(.0001,when);
  env.gain.linearRampToValueAtTime(volume,when+.007);
  env.gain.setValueAtTime(volume*.82,when+Math.min(.045,duration*.25));
  env.gain.exponentialRampToValueAtTime(.0001,when+duration+.045);
  filter.connect(env);env.connect(ac.destination);
  const osc=ac.createOscillator();
  osc.type=bass?'triangle':'square';osc.frequency.setValueAtTime(hz,when);
  const sub=ac.createOscillator(),subgain=ac.createGain();
  sub.type='sine';sub.frequency.setValueAtTime(hz*(bass?1:2),when);subgain.gain.value=bass?.20:.10;
  osc.connect(filter);sub.connect(subgain);subgain.connect(filter);
  osc.start(when);sub.start(when);osc.stop(when+duration+.06);sub.stop(when+duration+.06);
 }catch(e){}
}
const BASS_NOTES=['A3','E3','F3','C3','G3','D3','E3','A3'];
function musicTick(){
 if(status!=='playing'||muted||!ac||customTrackAvailable)return;
 const [note,d]=TUNE[musicIndex%TUNE.length],now=ac.currentTime;
 const seconds=d*.145;
 musicVoice(freq(note),now,Math.max(.09,seconds*.87),.056,false);
 if(musicIndex%4===0){
  const bass=BASS_NOTES[Math.floor(musicIndex/4)%BASS_NOTES.length];
  musicVoice(freq(bass),now,.46,.038,true);
  musicVoice(freq(bass)*1.5,now+.01,.36,.012,true);
 }
 musicIndex++;stepTimer=setTimeout(musicTick,d*145);
}
function startSynthMusic(){if(!stepTimer){initAudio();musicTick();}}
function stopMusic(){clearTimeout(stepTimer);stepTimer=null;customBgm.pause();}
function startMusic(){
 stopMusic();if(muted)return;
 // 별도 MP3가 없거나 브라우저에서 로드할 수 없으면 자체 합성 멜로디 사용
 if(customTrackAvailable===false){startSynthMusic();return;}
 const play=customBgm.play();
 if(play&&typeof play.catch==='function')play.catch(()=>{customTrackAvailable=false;startSynthMusic();});
 // 파일 존재 여부를 알 수 없는 경우 재생 시도와 별개로 실패 이벤트에서 대체 음악 시작
}
function persist(){try{localStorage.setItem('blockclassic_best',String(best))}catch(e){}}
function shuffleBag(){const arr=Object.keys(SHAPES);for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function drawType(){if(!bag.length)bag=shuffleBag();return bag.pop();}
function valid(c,x,y){return c.every(([a,b])=>{const xx=x+a,yy=y+b;return xx>=0&&xx<COLS&&yy<ROWS&&(yy<0||grid[yy][xx]===null);});}
function spawn(){groundedSince=null;let t=nextType;nextType=afterType;afterType=drawType();const s=SHAPES[t];piece={t,n:s.n,c:s.c.map(a=>[...a]),x:Math.floor((COLS-s.n)/2),y:-1};if(!valid(piece.c,piece.x,piece.y))gameOver();}
function reset(){gameGeneration++;grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));bag=[];nextType=drawType();afterType=drawType();score=0;lines=0;level=1;combo=-1;particles=[];lockFlash=null;groundedSince=null;fallAccum=0;last=performance.now();$('comboSide').style.display='none';$('pauseOverlay').classList.remove('active');$('overOverlay').classList.remove('active');$('toast').classList.remove('show');status='playing';spawn();updateHud();draw();startMusic();}
function move(dx,dy){if(status!=='playing'||!piece)return false;if(valid(piece.c,piece.x+dx,piece.y+dy)){piece.x+=dx;piece.y+=dy;refreshGroundedTimer();draw();return true;}return false;}
function rotate(){if(status!=='playing'||!piece||piece.t==='O')return;const n=piece.n,r=piece.c.map(([x,y])=>[n-1-y,x]);for(const [dx,dy] of [[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1]]){if(valid(r,piece.x+dx,piece.y+dy)){piece.c=r;piece.x+=dx;piece.y+=dy;refreshGroundedTimer();draw();return;}}}
function lock(){if(status!=='playing'||!piece)return;const flashCells=piece.c.map(([a,b])=>({x:piece.x+a,y:piece.y+b,color:COLORS[piece.t]}));for(const [a,b] of piece.c){let x=piece.x+a,y=piece.y+b;if(y<0){gameOver();return;}grid[y][x]=piece.t;}
 let keep=grid.filter(r=>r.some(v=>v===null)),cnt=ROWS-keep.length;
 if(cnt>0){grid=Array.from({length:cnt},()=>Array(COLS).fill(null)).concat(keep);let old=score;combo++;const multiplier=combo+1;const gained=SCORE[cnt]*multiplier;score+=gained;lines+=cnt;level=1+Math.floor(lines/20);
    effect(cnt);const label=['','SINGLE','DOUBLE','TRIPLE','TETRIS!'][cnt];let extra=combo>0?`<small>${multiplier} COMBO! · 점수 ×${multiplier}</small>`:'';
    toast(`${label} +${gained.toLocaleString('ko-KR')}${extra}`,1100);if(combo>0){$('comboSide').style.display='block';$('comboN').textContent=`×${combo+1}`;}else{$('comboSide').style.display='none';}
    if(Math.floor(score/5000)>Math.floor(old/5000)){fireworks(Math.floor(score/5000)*5000);boomSound();}
 } else{combo=-1;$('comboSide').style.display='none';}
 if(score>best){best=score;persist();}
 // 고정된 순간에 잠깐 밝게 빛나며 사라지는 연출
 lockFlash={cells:flashCells,start:performance.now(),duration:270};
 spawn();updateHud();draw();}
function hardDrop(){if(status!=='playing')return;while(move(0,1)){}lock();fallAccum=0;}
function toast(text,ms=1000){clearTimeout(toastTimeout);$('toast').innerHTML=text;$('toast').classList.add('show');toastTimeout=setTimeout(()=>$('toast').classList.remove('show'),ms);}
function fireworks(milestone){for(let k=0;k<6;k++){let cx=25+Math.random()*250,cy=35+Math.random()*330;const color=['#ffd86d','#56e5e9','#f879ae','#d8a5ff','#b1f89c'][k%5];for(let i=0;i<28;i++){let a=(i/28)*Math.PI*2,s=1.8+Math.random()*3.5;particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:65+Math.random()*25,max:90,color});}}
 toast(`🎆 ${milestone.toLocaleString('ko-KR')}점 돌파! 🎆`,1800);}
function gameOver(){status='over';stopMusic();if(score>best){best=score;persist();}updateHud();$('finalScore').textContent=`최종 점수 ${score.toLocaleString('ko-KR')}점 · 최고 ${best.toLocaleString('ko-KR')}점`;$('overOverlay').classList.add('active');}
function updateHud(){$('score').textContent=score.toLocaleString('ko-KR');$('level').textContent=level;$('lines').textContent=lines;$('best').textContent=best.toLocaleString('ko-KR');$('menuBest').textContent=best.toLocaleString('ko-KR');}
function cell(c,x,y,color,s=SIZE,opacity=1){if(y<0)return;const px=x*s,py=y*s;c.globalAlpha=opacity;c.fillStyle=color;c.fillRect(px+1,py+1,s-2,s-2);c.fillStyle='#ffffff5d';c.fillRect(px+3,py+3,s-6,3);c.fillStyle='#00000027';c.fillRect(px+3,py+s-6,s-6,3);c.strokeStyle='#101e31';c.lineWidth=1;c.strokeRect(px+.5,py+.5,s-1,s-1);c.globalAlpha=1;}
function drawPreview(target,type){
 target.clearRect(0,0,104,104);const s=SHAPES[type];if(!s)return;
 const cellSize=23,px=(104-s.n*cellSize)/2,py=(104-s.n*cellSize)/2;
 for(const [a,b] of s.c){target.fillStyle=COLORS[type];target.fillRect(px+a*cellSize+1,py+b*cellSize+1,cellSize-2,cellSize-2);target.fillStyle='#ffffff66';target.fillRect(px+a*cellSize+3,py+b*cellSize+3,cellSize-6,3);}
}
function draw(){ctx.fillStyle='#0f1b2e';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#253650';ctx.lineWidth=.7;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*30+.5,0);ctx.lineTo(x*30+.5,600);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*30+.5);ctx.lineTo(300,y*30+.5);ctx.stroke()}
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x])cell(ctx,x,y,COLORS[grid[y][x]]);
 if(piece&&(status==='playing'||status==='paused')){let gy=piece.y;while(valid(piece.c,piece.x,gy+1))gy++;for(const [a,b] of piece.c){if(gy+b>=0)cell(ctx,piece.x+a,gy+b,COLORS[piece.t],SIZE,.23);if(piece.y+b>=0)cell(ctx,piece.x+a,piece.y+b,COLORS[piece.t]);}}
 drawPreview(nctx,nextType);drawPreview(actx,afterType);
}
function pause(){if(status!=='playing')return;status='paused';stopMusic();$('pauseOverlay').classList.add('active');}
function resume(){if(status!=='paused')return;status='playing';last=performance.now();fallAccum=0;refreshGroundedTimer();$('pauseOverlay').classList.remove('active');startMusic();}
function menu(){status='menu';groundedSince=null;lockFlash=null;stopMusic();particles=[];$('game').classList.remove('active');$('menu').classList.add('active');$('pauseOverlay').classList.remove('active');$('overOverlay').classList.remove('active');updateHud();}
function frame(now){let dt=Math.min(80,Math.max(0,now-last));last=now;
 if(status==='playing'){
   fallAccum+=dt;
   const speed=Math.max(95,750*Math.pow(.84,level-1));
   if(fallAccum>=speed){fallAccum=0;move(0,1);}
   if(grounded()){
     if(groundedSince===null)groundedSince=now;
     else if(now-groundedSince>=LOCK_DELAY)lock();
   }else groundedSince=null;
 }
 if(particles.length){fctx.clearRect(0,0,300,600);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.065;p.vx*=.99;p.life--;fctx.globalAlpha=Math.max(0,p.life/p.max);fctx.fillStyle=p.color;fctx.fillRect(p.x,p.y,4,4);}fctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);}
 else{fctx.clearRect(0,0,300,600);}
 if(lockFlash){
   const age=now-lockFlash.start,remain=Math.max(0,1-age/lockFlash.duration);
   if(remain<=0)lockFlash=null;
   else{
     fctx.save();
     fctx.globalCompositeOperation='screen';
     for(const c of lockFlash.cells){
       if(c.y<0)continue;
       const x=c.x*SIZE,y=c.y*SIZE;
       fctx.globalAlpha=remain*.72;
       fctx.shadowColor=c.color;fctx.shadowBlur=18*remain+4;
       fctx.fillStyle=c.color;fctx.fillRect(x+2,y+2,SIZE-4,SIZE-4);
       fctx.globalAlpha=remain*.85;
       fctx.shadowBlur=8;fctx.strokeStyle='#ffffff';fctx.lineWidth=2;
       fctx.strokeRect(x+2,y+2,SIZE-4,SIZE-4);
     }
     fctx.restore();
   }
 }
 requestAnimationFrame(frame);
}
function act(kind){if(status!=='playing')return;if(kind==='drop'){hardDrop();return;}inputActivity();if(kind==='left')move(-1,0);if(kind==='right')move(1,0);if(kind==='down'){move(0,1);fallAccum=0;}if(kind==='turn')rotate();}
function bindControl(id,kind,repeat=false){let timeout=null,interval=null,active=false;const el=$(id);
 function clear(){clearTimeout(timeout);clearInterval(interval);timeout=null;interval=null;active=false;}
 el.addEventListener('pointerdown',e=>{e.preventDefault();if(active)return;active=true;try{el.setPointerCapture(e.pointerId)}catch(_){}act(kind);if(repeat){timeout=setTimeout(()=>{interval=setInterval(()=>act(kind),70)},210);}});
 for(const ev of ['pointerup','pointercancel','lostpointercapture','pointerleave'])el.addEventListener(ev,clear);
}
bindControl('leftBtn','left',true);bindControl('rightBtn','right',true);bindControl('turnBtn','turn');bindControl('downBtn','down',true);bindControl('dropBtn','drop');
let gesture=null;
board.addEventListener('pointerdown',e=>{if(status!=='playing')return;e.preventDefault();try{board.setPointerCapture(e.pointerId)}catch(_){}gesture={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false,time:performance.now()};});
board.addEventListener('pointermove',e=>{if(!gesture||status!=='playing')return;const step=board.getBoundingClientRect().width/10;let dx=e.clientX-gesture.lastX,dy=e.clientY-gesture.lastY;
 while(dx>step*.85){act('right');gesture.lastX+=step*.85;dx=e.clientX-gesture.lastX;gesture.moved=true;}
 while(dx<-step*.85){act('left');gesture.lastX-=step*.85;dx=e.clientX-gesture.lastX;gesture.moved=true;}
 while(dy>step){act('down');gesture.lastY+=step;dy=e.clientY-gesture.lastY;gesture.moved=true;}
});
board.addEventListener('pointerup',e=>{if(!gesture)return;if(!gesture.moved&&Math.abs(e.clientX-gesture.x)<15&&Math.abs(e.clientY-gesture.y)<15)act('turn');gesture=null;});
board.addEventListener('pointercancel',()=>{gesture=null;});
$('startBtn').addEventListener('click',()=>{initAudio();$('menu').classList.remove('active');$('game').classList.add('active');reset();});
$('pauseBtn').addEventListener('click',pause);$('resumeBtn').addEventListener('click',resume);$('menuBtn').addEventListener('click',menu);$('overMenuBtn').addEventListener('click',menu);$('retryBtn').addEventListener('click',()=>{initAudio();reset();});
$('exitBtn').addEventListener('click',()=>{stopMusic();if(status==='playing')pause();alert('게임을 종료하려면 홈 화면으로 이동하거나 브라우저 탭을 닫으세요.');});
$('soundBtn').addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('blockclassic_mute',String(muted));}catch(e){}$('soundBtn').textContent=muted?'🔇':'🔊';$('soundBtn').setAttribute('aria-label',muted?'소리 켜기':'소리 끄기');if(muted)stopMusic();else if(status==='playing')startMusic();});
$('soundBtn').textContent=muted?'🔇':'🔊';
window.androidBack=()=>{if(status==='playing')pause();else if(status==='paused'||status==='over')menu();else if(status==='playing')pause();};
document.addEventListener('keydown',e=>{const keys=['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','Escape','p','P'];if(keys.includes(e.key))e.preventDefault();if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(status==='playing')pause();else if(status==='paused')resume();return;}const k={'ArrowLeft':'left','ArrowRight':'right','ArrowDown':'down','ArrowUp':'turn',' ':'drop'}[e.key];if(k)act(k);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&status==='playing')pause();});
function resize(){const h=window.innerHeight,w=window.innerWidth,menuHeight=48,hudHeight=61,controlsHeight=Math.max(76,Math.min(115,h*.115)),fixed=menuHeight+hudHeight+controlsHeight+36;const bw=Math.max(120,Math.min(360,w-115,(h-fixed)/2));document.documentElement.style.setProperty('--board-w',Math.floor(bw)+'px');}
window.addEventListener('resize',resize);resize();updateHud();draw();requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
</script>
